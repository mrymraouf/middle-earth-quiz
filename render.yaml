databases:
  - name: middle-earth-quiz-db
    plan: free
    region: frankfurt
    databaseName: middle_earth_quiz_db
    user: middle_earth_quiz_db_user

services:
  - type: web
    name: middle-earth-quiz
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: >-
      mkdir -p /tmp/quiz-src &&
      unzip -oq middle_earth_quiz_project_v2_balanced.zip -d /tmp/quiz-src &&
      SRC="$(find /tmp/quiz-src -type f -name questions.json -print -quit)" &&
      test -n "$SRC" &&
      cp "$SRC" ./questions.json &&
      PUB="$(dirname "$SRC")/public" &&
      test -d "$PUB" &&
      rm -rf ./public &&
      cp -R "$PUB" ./public &&
      npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: middle-earth-quiz-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
